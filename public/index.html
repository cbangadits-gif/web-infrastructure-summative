<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rwanda Electricity Tax Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Rwanda Electricity Tax Manager</h1>
            <p>Calculate and track 18% VAT on electricity sales (RRA compliant).</p>
        </header>

        <main>
            <section class="calculator-form">
                <h2>New Tax Calculation</h2>
                <div class="input-group">
                    <label for="amount">Amount (RWF):</label>
                    <input type="number" id="amount" placeholder="e.g. 100000" min="1" required>
                </div>
                <div class="input-group">
                    <label for="category">Consumer Category:</label>
                    <select id="category">
                        <option value="standard">Standard (18% VAT)</option>
                        <option value="exempt">Exempt (0% VAT)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="currency">Report in Currency:</label>
                    <select id="currency">
                        <option value ="USD">USD (US Dollar)</option>
                        <option value="EUR">EUR (Euro)</option>
                    </select>
                </div>
                <button id="calculate-btn">Calculate VAT</button>
                <div id="error-message" class="error"></div>
            </section>
            <section class="results">
                <h2>Calculation Result</h2>
                <div id="result-display" class="result-box">
                    <p>Enter an amount and select a category to calculate VAT.</p>
                </div>
            </section>
            <section class="history">
                <h2>Declaration History</h2>
                <!-- Search and Filter -->
                <div class="controls">
                    <input type="text" id="search-input" placeholder="Search by date or amount...">
                    <select id="filter-category">
                        <option value="all">All Categories</option>
                        <option value="standard">Standard</option>
                        <option value="exempt">Exempt</option>
                    </select>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Category</th>
                            <th>Revenue (RWF)</th>
                            <th>VAT Due (RWF)</th>
                            <th>VAT in Foreign Currency</th>
                        </tr>
                    </thead>
                    <tbody id="history-body">
                        <!-- Rows will be added here by JavaScript -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>
    <script src="script.js"></script>  
</body>
</html>
